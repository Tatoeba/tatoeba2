# Avoid race condition when stopping Manticore daemon:
#
# If MariaDB gets stopped before Manticore, the stopper script
# /usr/bin/searchd --config /etc/manticoresearch/manticore.conf --stopwait
# will error because the configuration cannot be read, because its
# contents are generated by `cake sphinx_conf`, a script that queries
# the database (to know what languages have at least one sentence).
#
# Warning: do not add Requires=mariadb.service because it kills Manticore
# during any update of the mariadb-server package (bug #3328).
[Unit]
After=mariadb.service
